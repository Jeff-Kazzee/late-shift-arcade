<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0c14">
  <title>Late Shift Arcade</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B9%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0c14;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 90% 70% at 50% 40%, #141728 0%, #0b0c14 70%);
    }
    #cabinet {
      position: relative;
      padding: 14px;
      border-radius: 18px;
      background: linear-gradient(180deg, #171a2b 0%, #101322 55%, #0d0f1c 100%);
      border: 1px solid rgba(233, 236, 244, 0.12);
      box-shadow:
        0 0 90px rgba(124, 136, 232, 0.14),
        0 30px 80px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(233, 236, 244, 0.08);
    }
    #screen {
      display: block;
      background: #0b0c14;
      border-radius: 8px;
      touch-action: none;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
    }
    #exit {
      position: absolute;
      top: 22px;
      right: 22px;
      width: 44px;
      height: 44px;
      background: rgba(11, 12, 20, 0.6);
      color: rgba(243, 235, 221, 0.65);
      border: 1px solid rgba(233, 236, 244, 0.18);
      border-radius: 8px;
      font: 20px "Courier New", monospace;
      cursor: pointer;
      display: none;
      transition: color 120ms, border-color 120ms, box-shadow 120ms;
    }
    #exit:hover {
      color: #e6c17e;
      border-color: rgba(230, 193, 126, 0.6);
      box-shadow: 0 0 14px rgba(230, 193, 126, 0.25);
    }
    noscript { color: #f3ebdd; font: 16px "Courier New", monospace; }
  </style>
</head>
<body>
  <div id="cabinet">
    <canvas id="screen" width="640" height="480"></canvas>
    <button id="exit" aria-label="Back to cabinet">✕</button>
  </div>
  <noscript>Late Shift Arcade needs JavaScript — the cabinet is unplugged.</noscript>
  <script type="module" src="shell/main.js"></script>
</body>
</html>
